[package]
name = "zte"
version = "0.2.0"
edition = "2024"

[features]
clipboard = ["dep:clipboard"]
default = ["clipboard"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
slotmap = "1.0"
crossterm = { version = "0.29", features = ["event-stream", "osc52"] }
thiserror = "1.0"
chumsky = { version = "0.10.1", features = ["pratt"] }
unicode-display-width = "0.3.0"
clipboard = { version = "0.5.0", optional = true }
alacritty_terminal = "0.25.1"
tokio = { version = "1.49.0", default-features = false, features = ["io-util", "macros", "process", "rt", "sync", "time"] }
futures = "0.3.31"
pty-process = { version = "0.5.3", features = ["async"] }

[profile.dev]
opt-level = 2
